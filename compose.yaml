services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mundo_viagens
      POSTGRES_USER: mundo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mundo_dev}
    ports:
      - "5432:5432"
    volumes:
      - mundo_viagens_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: mundo
      DB_PASSWORD: ${DB_PASSWORD:-mundo_dev}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mundo_viagens_data:
